name: Daily Intelligence Learning Cycle

on:
  schedule:
    # 08:00 JST = previous day 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intelligence-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Tokyo
      PIPELINE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned OpenCode
        run: npm install --global opencode-ai@1.18.31
      - name: Check contracts and failure handling
        run: |
          python3 -m unittest discover -s tests -q
          bash scripts/validate-output.sh
      - name: Run cycle
        id: cycle
        continue-on-error: true
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: bash scripts/run-pipeline.sh
      - name: Persist verified public derivatives
        if: steps.cycle.outcome == 'success'
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name "I-am-S-2 Bot"
          git -C "$GITHUB_WORKSPACE" config user.email "bot@i-am-s-2.github.io"
          python3 scripts/publish-generated.py "$PIPELINE_RUN_ID"
      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/runs/
            state/shadow/data/forecast_ledger/transactions/
            state/shadow/Intelligence/
            state/shadow/static_intelligence/
            state/shadow/reviews/
            state/shadow/state/scores/
            data/forecast_ledger/transactions/
            reviews/
            state/scores/
          retention-days: 30
      - name: Report actual run result
        if: always()
        env:
          CYCLE_OUTCOME: ${{ steps.cycle.outcome }}
        run: |
          ./ias2 status >> "$GITHUB_STEP_SUMMARY"
          test "$CYCLE_OUTCOME" = success
